{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block title %}
    <title>EDVER Shop</title>
    {% endblock %}
</head>

<body class="site-body">
    {% include "header.html" %}

    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>

    {% include "footer.html" %}

    {% block scripts %}
    <script src="{% static 'js/main.js' %}"></script>
    {% endblock %}
</body>

</html>
