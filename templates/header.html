<header class="header">
    <div class="header-left">
        <a href="/" class="logo">
            {% if site_logo and site_logo.image %}
                <img src="{{ site_logo.image.url }}" alt="{{ site_logo.text }}" class="logo-img">
            {% else %}
                {{ site_logo.text|default:"EDVER Shop" }}
            {% endif %}
        </a>
    </div>
    <nav class="header-center">
        <a href="/catalog/">Каталог</a>
        <a href="/about/">О нас</a>
        <a href="/contacts/">Контакты</a>
    </nav>
    <div class="header-right">
        <a href="tel:{{ phone.number }}" class="header-icon" aria-label="Телефон">📞</a>
        <a href="{{ instagram.url }}" class="header-icon" aria-label="Instagram" target="_blank" rel="noopener">📷</a>
        <a href="/profile/" class="header-icon" aria-label="Профиль">👤</a>
        <button class="burger" id="burger" aria-label="Меню" aria-expanded="false">
            <span class="burger-bar"></span>
            <span class="burger-bar"></span>
            <span class="burger-bar"></span>
        </button>
    </div>
    <nav class="header-menu" id="main-nav">
        <a href="/catalog/">Каталог</a>
        <a href="/about/">О нас</a>
        <a href="/contacts/">Контакты</a>
        <a href="/payment/">Оплата</a>
        <a href="/returns/">Возврат товара</a>
        <a href="tel:{{ phone.number }}" class="header-menu-contact">📞 {{ phone.number }}</a>
        <a href="{{ instagram.url }}" class="header-menu-contact" target="_blank" rel="noopener">📷 Мы в Instagram</a>
    </nav>
</header>
