{% extends "base.html" %}

{% block title %}
<title>Вход — EDVER Shop</title>
{% endblock %}

{% block content %}
<div class="catalog-page">
    <div class="container breadcrumbs-wrap">
        <nav class="breadcrumbs" aria-label="Навигация">
            <a href="/">Главная</a>
            <span class="breadcrumbs__sep">/</span>
            <span class="breadcrumbs__current">Вход</span>
        </nav>
    </div>

    <section class="container" style="padding: 3rem 20px 4rem; max-width: 440px; margin: 0 auto;">
        <h1 class="catalog-head__title" style="text-align: center;">Вход в аккаунт</h1>

        {% if form.errors %}
        <div class="alert alert--error" style="margin-top: 1rem;">
            Неверный телефон или пароль. Попробуйте ещё раз.
        </div>
        {% endif %}

        <form method="post" class="form form--stacked" style="margin-top: 1.5rem;">
            {% csrf_token %}
            <div class="form-row">
                <label for="id_username">Телефон</label>
                <input id="id_username" name="username" type="text" inputmode="tel"
                       placeholder="+375 (29) XXX-XX-XX" autofocus
                       value="{{ form.username.value|default:'' }}">
            </div>
            <div class="form-row">
                <label for="id_password">Пароль</label>
                <input id="id_password" name="password" type="password" placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn btn--primary btn--block" style="margin-top: 1rem;">Войти</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--color-text-muted);">
            Нет аккаунта? <a href="{% url 'app_user:register' %}" style="color: var(--color-accent); font-weight: 500;">Зарегистрироваться</a>
        </p>
    </section>
</div>
{% endblock %}
