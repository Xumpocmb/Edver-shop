<div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite" aria-label="Согласие на использование cookie" hidden>
    <div class="cookie-banner__inner">
        <div class="cookie-banner__text">
            <p>
                Мы используем cookie для корректной работы сайта и, с вашего согласия, для аналитики.
                Продолжая использование сайта, вы соглашаетесь с
                <a href="/privacy/">политикой обработки персональных данных</a>.
            </p>
        </div>
        <div class="cookie-banner__actions">
            <button type="button" class="btn btn--ghost btn--sm" id="cookie-reject">Только необходимые</button>
            <button type="button" class="btn btn--primary btn--sm" id="cookie-accept">Принять</button>
        </div>
    </div>
</div>
